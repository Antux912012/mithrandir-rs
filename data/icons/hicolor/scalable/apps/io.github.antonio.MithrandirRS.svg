<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Rust Palette Gradients based on #B7410E -->
    <linearGradient id="rustBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DE5D24"/>
      <stop offset="45%" stop-color="#B7410E"/>
      <stop offset="100%" stop-color="#7A2202"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FED7AA" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base App Squircle Plate -->
  <rect x="8" y="8" width="112" height="112" rx="26" ry="26" fill="url(#rustBg)" filter="url(#shadow)"/>
  <!-- Highlight Rim -->
  <rect x="9" y="9" width="110" height="110" rx="25" ry="25" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.3"/>
  <rect x="8" y="8" width="112" height="112" rx="26" ry="26" fill="none" stroke="#5C1A01" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Subtle Outer Energy Ring -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="#FED7AA" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="6,4"/>

  <!-- Mithrandir Staff & Magic Core (Star + Speed Boost) -->
  <g filter="url(#glow)">
    <!-- 8-Point Star Core -->
    <path d="M 64 22 L 68 46 L 88 38 L 74 54 L 98 64 L 74 74 L 88 90 L 68 82 L 64 106 L 60 82 L 40 90 L 54 74 L 30 64 L 54 54 L 40 38 L 60 46 Z"
          fill="url(#shieldGrad)" fill-opacity="0.25"/>

    <!-- Central High-Velocity Bolt (Smart Boost) -->
    <path d="M 68 28 L 50 62 L 63 62 L 57 98 L 78 56 L 65 56 Z"
          fill="url(#boltGrad)" stroke="#B7410E" stroke-width="1"/>

    <!-- Sparkle Orbs -->
    <circle cx="64" cy="20" r="3" fill="#FFFFFF"/>
    <circle cx="96" cy="40" r="2.5" fill="#FED7AA"/>
    <circle cx="32" cy="86" r="2.5" fill="#FED7AA"/>
  </g>

  <!-- Rust "R" Accent Badge in Bottom-Right -->
  <circle cx="94" cy="94" r="14" fill="#5C1A01" stroke="#FED7AA" stroke-width="1.5"/>
  <text x="94" y="99" font-family="monospace, sans-serif" font-weight="900" font-size="14" fill="#FFF7ED" text-anchor="middle">R</text>
</svg>
