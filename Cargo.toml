[package]
name = "mithrandir-rs"
version = "0.4.2"
edition = "2021"
description = "Modern GNU/Linux Cleaner, Optimizer, Telemetry & Diagnostics in Rust"
authors = ["Antonio"]
license = "GPL-3.0-or-later"

[features]
default = []
gui = ["dep:gtk4", "dep:libadwaita"]

[dependencies]
libc = "0.2"
sysinfo = "0.33"
walkdir = "2.5"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
zbus = { version = "5.5", default-features = false, features = ["tokio"] }
async-channel = "2.3"
ksni = { version = "0.3", features = ["blocking"] }

gtk4 = { version = "0.9", features = ["v4_12"], optional = true }
libadwaita = { version = "0.7", features = ["v1_5"], optional = true }
